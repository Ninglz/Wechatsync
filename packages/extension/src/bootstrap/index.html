<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在连接 AHAX</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef9f8; color: #123c3b; }
      main { width: min(420px, calc(100vw - 48px)); padding: 32px; border: 2px solid #123c3b; border-radius: 24px; background: #fffef8; box-shadow: 8px 8px 0 #9adceb; }
      small { font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #287f7b; }
      h1 { margin: 12px 0 10px; font-size: 28px; line-height: 1.15; }
      p { margin: 0; color: #456563; line-height: 1.7; }
      button { display: none; margin-top: 20px; width: 100%; border: 2px solid #123c3b; border-radius: 999px; padding: 12px 18px; background: #f3d52e; color: #123c3b; font: inherit; font-weight: 800; cursor: pointer; }
      button[data-visible="true"] { display: block; }
    </style>
  </head>
  <body>
    <main>
      <small>AHAX Local Agent</small>
      <h1 id="title">正在连接本机 Agent</h1>
      <p id="message">Chrome 可能会询问是否允许访问本地网络。允许后会自动进入 AHAX。</p>
      <button id="retry" type="button">重新连接</button>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
